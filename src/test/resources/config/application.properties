# ══════════════════════════════════════════════════════════════
#  Universal BDD Selenium Framework — Base Configuration
#  Override any value with a system property: -Dkey=value
# ══════════════════════════════════════════════════════════════

# ── Application ──────────────────────────────────────────────
app.base.url=https://demo.playwright.dev
login.path=/todomvc

# ── Browser ──────────────────────────────────────────────────
browser=chrome
headless=false

# ── Timeouts (seconds) ────────────────────────────────────────
wait.implicit=0
wait.explicit=15
wait.page.load=30

# ── Selenium Grid (leave empty for local execution) ───────────
grid.url=

# ── Paths ────────────────────────────────────────────────────
screenshot.dir=target/screenshots
download.dir=target/downloads
screenshot.on.pass=false

# ── Allure ───────────────────────────────────────────────────
allure.results.directory=target/allure-results

# ── Test Users (override in env-specific files) ───────────────
test.user.email=test@example.com
test.user.password=Password123!
test.admin.email=admin@example.com
test.admin.password=Admin@123!

# ── Jira Integration (optional) ───────────────────────────────
jira.base.url=
jira.username=
jira.api.token=
jira.project.key=DEMO

# ── AI Agent / Anthropic (optional) ──────────────────────────
anthropic.api.key=
anthropic.model=claude-sonnet-4-6

# ── MCP Selenium (optional, requires Node.js) ─────────────────
mcp.enabled=false
mcp.node.path=node

# ── Page paths ───────────────────────────────────────────────
page.login=/login
page.dashboard=/dashboard
page.profile=/profile
page.settings=/settings
page.register=/register
